# DeepfakeDetector Canada — Nginx Reverse Proxy
# Sécurité renforcée : TLS 1.3, HSTS, rate limiting, no server tokens

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Sécurité de base ─────────────────────────────────────────────────────
    server_tokens off;                  # Pas de version Nginx dans les headers
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Logs ─────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time';

    access_log /var/log/nginx/access.log main;

    # ── Rate limiting global ─────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_global:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m  rate=5r/m;
    limit_req_status 429;

    # ── Tailles upload ───────────────────────────────────────────────────────
    client_max_body_size 520m;          # 500 MB + marge
    client_body_timeout 300s;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # ── Gzip ─────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types application/json text/plain;
    gzip_min_length 1024;

    # ── Upstream API ─────────────────────────────────────────────────────────
    upstream deepfake_api {
        server api:8000;
        keepalive 32;
    }

    # ── Serveur HTTP → redirect HTTPS + ACME challenge ───────────────────────
    server {
        listen 80;
        server_name _;

        # Let's Encrypt ACME HTTP-01 challenge (certbot webroot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Health check sans redirect (pour Docker healthcheck)
        location /health {
            proxy_pass http://deepfake_api;
            proxy_set_header Host $host;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── Serveur HTTPS ─────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # ── TLS ──────────────────────────────────────────────────────────────
        # Dev  : ./nginx/ssl/cert.pem (self-signed, docker-compose.yml)
        # Prod : /etc/nginx/ssl/ → symlinks vers Let's Encrypt (docker-compose.prod.yml)
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # OCSP Stapling (prod — commenter en dev)
        # ssl_stapling on;
        # ssl_stapling_verify on;

        # ── Security Headers ─────────────────────────────────────────────────
        # Note: X-Content-Type-Options/CSP/etc. sont aussi dans FastAPI middleware
        # Ces headers Nginx couvrent les réponses d'erreur Nginx elles-mêmes
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # ── Routes Auth (rate limit strict) ──────────────────────────────────
        location /auth/token {
            limit_req zone=auth_zone burst=3 nodelay;
            proxy_pass http://deepfake_api;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Upload fichiers (timeout long) ───────────────────────────────────
        location /analyze/upload {
            limit_req zone=api_global burst=5 nodelay;
            client_max_body_size 520m;
            proxy_pass         http://deepfake_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_request_buffering off;         # Streaming upload direct
            proxy_read_timeout  600s;
            proxy_send_timeout  600s;
        }

        # ── API principale ────────────────────────────────────────────────────
        location / {
            limit_req zone=api_global burst=20 nodelay;
            proxy_pass         http://deepfake_api;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";    # Keepalive upstream
        }

        # ── Pages d'erreur personnalisées ────────────────────────────────────
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"detail":"Trop de requêtes — veuillez patienter.","code":"RATE_LIMIT_EXCEEDED"}';
            add_header Content-Type application/json;
        }

        error_page 502 503 504 /5xx.json;
        location = /5xx.json {
            internal;
            return 503 '{"detail":"Service temporairement indisponible.","code":"SERVICE_UNAVAILABLE"}';
            add_header Content-Type application/json;
        }
    }
}
