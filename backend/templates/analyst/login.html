<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — DeepfakeDetector Analyste</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/analyst/static/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
        <rect width="56" height="56" rx="14" fill="#00cba4" fill-opacity=".1" stroke="#00cba4" stroke-opacity=".3" stroke-width="1"/>
        <path d="M28 10L44 19v18l-16 9-16-9V19L28 10z" stroke="#00cba4" stroke-width="2" fill="none"/>
        <path d="M28 10v28M12 19l16 9 16-9" stroke="#00cba4" stroke-width="2" opacity=".3"/>
        <circle cx="28" cy="28" r="5" fill="#00cba4" fill-opacity=".8"/>
      </svg>
      <h1>Interface Analyste</h1>
      <p>Plateforme forensique deepfake — Canada</p>
    </div>

    {% if error %}
    <div class="flash flash-error" style="margin-bottom:20px">{{ error }}</div>
    {% endif %}

    <form method="post" action="/analyst/login">
      <div class="form-group">
        <label class="form-label">Nom d'utilisateur</label>
        <input name="username" type="text" class="form-control" placeholder="analyste@exemple.ca" autocomplete="username" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Mot de passe</label>
        <input name="password" type="password" class="form-control" placeholder="••••••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary w-full" style="justify-content:center">
        <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M15 12H3"/>
        </svg>
        Se connecter
      </button>
    </form>

    <div class="login-legal">
      Accès réservé aux analystes autorisés.<br>
      Toutes les sessions sont enregistrées et auditées.<br>
      Conforme LPC art. 31.1-31.6 &bull; R. c. Mohan [1994] 2 RCS 9
    </div>
  </div>
</div>
</body>
</html>
