schema_version: "1.0"
protocol_id: "baseline_protocol"
protocol_version: "v1"
status: "applied_metadata_v1"

description: >
  Protocole d'évaluation de base pour les moteurs de détection deepfake.
  Un engine ne peut passer à l'état 'validated' que si ce protocole est
  complété avec des résultats documentés et une approbation humaine.

dataset_requirements:
  - jeu_test_independent: true
  - separation_train_val_test: strict
  - n_minimum_samples: 1000
  - balance_classes: required
  - sources_multiples: required

test_conditions:
  - compression_sociale: true     # YouTube, TikTok, WhatsApp recompression
  - basse_resolution: true        # 240p, 360p
  - bruit_audio: true             # SNR < 10dB
  - reencodage: true              # H.264 → H.265 → H.264
  - recadrage: true
  - captures_ecran: true
  - nouvelles_techniques: true    # generators absents de l'entraînement

metrics_required:
  - auc
  - eer
  - far_at_thresholds: [0.01, 0.05, 0.10]
  - frr_at_thresholds: [0.01, 0.05, 0.10]
  - precision
  - recall
  - f1
  - mcc
  - confidence_intervals: 95pct
  - calibration_curve: true
  - subgroup_performance: true
  - confusion_matrix: true
  - roc_curve: true

approval_required:
  - human_review: true
  - audit_log_entry: true
  - model_card: true
  - metrics_json: true

notes: >
  Protocole partiellement appliqué (metadata 2026-10-05, rppg 2026-10-06, biometrics 2026-10-06).
  Aucun engine n'est encore en statut 'validated' — approbation humaine manquante (condition 4).
  Ce fichier définit les critères de validation et trace les applications.

