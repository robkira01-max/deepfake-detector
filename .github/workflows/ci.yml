name: CI — DeepfakeDetector Canada

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]

jobs:
  # ── Linting & Type checking ───────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint dependencies
        run: |
          pip install ruff mypy bandit types-requests

      - name: Ruff (lint + format check)
        run: ruff check backend/ --select=E,F,W,I --ignore=E501
        continue-on-error: true

      - name: Bandit SAST (no HIGH, no MEDIUM)
        run: |
          bandit -r backend/ \
            --exclude backend/tests \
            -ll -ii \
            --format json \
            -o bandit-report.json || true
          # Fail on HIGH severity only
          bandit -r backend/ \
            --exclude backend/tests \
            -lll \
            --quiet

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  # ── Tests + Coverage ──────────────────────────────────────────────────────────
  test:
    name: Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Generate test RSA keys
        run: |
          cd backend
          python -c "
          from pathlib import Path
          from core.security import generate_rsa_keypair
          Path('keys').mkdir(exist_ok=True)
          generate_rsa_keypair(Path('keys'))
          " || python -c "
          import subprocess, pathlib
          pathlib.Path('keys').mkdir(exist_ok=True)
          subprocess.run(['openssl', 'genrsa', '-out', 'keys/private.pem', '2048'], check=True)
          subprocess.run(['openssl', 'rsa', '-in', 'keys/private.pem', '-pubout',
                          '-out', 'keys/public.pem'], check=True)
          subprocess.run(['openssl', 'genrsa', '-out', 'keys/audit_private.pem', '2048'], check=True)
          "

      - name: Run tests with coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: redis://localhost:6379/2
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DEBUG: "true"
          MFA_REQUIRED: "false"
          APP_ENV: test
          JWT_PRIVATE_KEY_PATH: keys/private.pem
          JWT_PUBLIC_KEY_PATH: keys/public.pem
          AUDIT_SIGNING_KEY_PATH: keys/audit_private.pem
        run: |
          cd backend
          python -m pytest tests/ \
            --cov=. \
            --cov-report=xml:coverage.xml \
            --cov-report=term \
            --cov-fail-under=85 \
            -q

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

      - name: Archive coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: backend/coverage.xml

  # ── Tests PostgreSQL ─────────────────────────────────────────────────────────
  # Valide que l'app fonctionne avec PostgreSQL (divergence dev/prod CLAUDE.md)
  test-postgres:
    name: Tests PostgreSQL
    runs-on: ubuntu-latest
    needs: [test]   # Seulement si les tests SQLite passent

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: test_deepfake
        options: >-
          --health-cmd "pg_isready -U testuser -d test_deepfake"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Generate test RSA keys
        run: |
          cd backend
          mkdir -p keys
          openssl genrsa -out keys/private.pem 2048
          openssl rsa -in keys/private.pem -pubout -out keys/public.pem
          openssl genrsa -out keys/audit_private.pem 2048

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -p 5432 -U testuser; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

      - name: Run tests on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_deepfake
          DATABASE_URL: postgresql://testuser:testpass@localhost:5432/test_deepfake
          REDIS_URL: redis://localhost:6379/2
          CELERY_BROKER_URL: redis://localhost:6379/0
          CELERY_RESULT_BACKEND: redis://localhost:6379/1
          DEBUG: "true"
          MFA_REQUIRED: "false"
          APP_ENV: test
          JWT_PRIVATE_KEY_PATH: keys/private.pem
          JWT_PUBLIC_KEY_PATH: keys/public.pem
          AUDIT_SIGNING_KEY_PATH: keys/audit_private.pem
        run: |
          cd backend
          python -m pytest tests/ \
            --ignore=tests/test_integration.py \
            -q --tb=short \
            -x \
            --timeout=60

      - name: Upload PostgreSQL test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-postgres-results
          path: backend/.pytest_cache/

  # ── Docker build ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, test-postgres]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: deepfake-detector-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Security scan ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy on Dockerfile
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "./backend"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "0"   # Ne bloque pas le CI pour l'instant — surveillance uniquement
